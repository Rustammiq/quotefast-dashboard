[build]
  # Build command for Next.js
  command = "npm run build"
  
  # Publish directory (Next.js default)
  publish = ".next"
  
  # Node.js version and environment variables
  [build.environment]
    NODE_VERSION = "18"
    NPM_VERSION = "9"
    NEXT_PUBLIC_SUPABASE_URL = ""
    NEXT_PUBLIC_SUPABASE_ANON_KEY = ""
    SUPABASE_SERVICE_ROLE_KEY = ""
    DATABASE_URL = ""
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = ""
    STRIPE_SECRET_KEY = ""
    STRIPE_WEBHOOK_SECRET = ""
    OPENAI_API_KEY = ""
    RESEND_API_KEY = ""
    NEXT_PUBLIC_APP_URL = ""

# Redirect rules for Next.js routing (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# API routes redirect to Netlify Functions
[[redirects]]
  from = "/api/auth/reset-password"
  to = "/.netlify/functions/auth-reset-password"
  status = 200

[[redirects]]
  from = "/api/customers"
  to = "/.netlify/functions/customers"
  status = 200

[[redirects]]
  from = "/api/invoices"
  to = "/.netlify/functions/invoices"
  status = 200

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/webhooks/stripe"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Environment variables are now defined above in the build.environment section
